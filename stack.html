<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .slider {
            width: 100vw;
            overflow: scroll;
            display: inline-flex;
            scrollbar-width: none;
        }
        .item{
            min-width:100vh;
            height:600vh;
            position: sticky;
            left: 0px;
            font-size: 50px;
            color: white;
            -webkit-text-stroke-width: 2px ;
            text-align: center;
        }
        .div{
            display: block;
            unicode-bidi: isolate;
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="item" style="background-color: blue;">1</div>
        <div class="item" style="background-color: red;">2</div>
        <div class="item" style="background-color: green;">3</div>
        <div class="item" style="background-color: yellow;">4</div>
        <div class="item" style="background-color: purple;">5</div>
    </div>
</body>
</html>
