<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            grid-template-areas:
                "box1 box1 box2"
                "box1 box1 box3"
                "box4 box5 box6"
                "box3 box5 box7";

            outline: 1px solid black;
        }

        .container > div {
            font-size: 30px;
            outline: 1px dashed black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="grid-area:box1">1</div>
        <div style="grid-area:box2">2</div>
        <div style="grid-area:box3">3</div>
        <div style="grid-area:box4">4</div>
        <div style="grid-area:box5">5</div>
        <div style="grid-area:box6">6</div>
        <div style="grid-area:box7">7</div>
    </div>
</body>
</html>
