<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Four Floating Divs</title>
	<style>
		.float-card {
			float: left;
            height: 100px;
            width: 200px;
			padding: 10px;
			margin: 5px;
			box-sizing: border-box;
            
		}

		#one,#three,#five { background-color: #474545; }

		.float-card img {
			float: right;
			width: 70px;
			height: 70px;
			margin-left: 10px;
			object-fit: cover;
		}
		
	</style>
</head>
<body>
	<div id="one" class="float-card">
		<img src="https://picsum.photos/200" alt="Placeholder image">
		<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
	</div>

</body>
</html>
