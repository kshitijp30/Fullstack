<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Query Example</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .parent {
            font-size: 20px;
        }
        .parent {
            container-type: inline-size;
            container-name: parent;
        }

        @container parent (width > 1500px) {
            .child{
                font-size: 300px;
                background-color: rgb(155, 125, 125);
            }
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            <p>Hello World</p>
        </div>
    </div>
</body>
</html>
