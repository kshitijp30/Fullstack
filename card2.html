    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .card-header {
                border: 1px solid black;
                border-radius: 5px;
                flex : 1;
                display: flex;
                flex-wrap: wrap;
                flex-direction: row;
                align-content: center;
            }
            .lable{
                display: block;
                unicode-bidi: isolate;
                display: flex;
                flex-direction: row;
            }
        </style>

    <body>
        <h1>Login Form</h1>
        <div style="border: 1px solid black;" display="flex" flex-wrap="wrap" flex-direction="row" align-content="center">

                <input type="email" name="email" placeholder="Enter your email" ><br><br>
